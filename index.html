<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="images/pokepuz.ico" type="image/x-icon">
<title>Pokemon Puzzle</title>
<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
<h1>Pokemon Puzzle</h1>

<div class="Aven">
    <div class="origin">
        <img src="images/pokeman.jpg" alt="Original Image">
    </div>

    <div>
        <div class="photo">
            <img src="images/9.jpg" id="h1" onclick="move(1)">
            <img src="images/8.jpg" id="h2" onclick="move(2)">
            <img src="images/7.jpg" id="h3" onclick="move(3)">
            <img src="images/6.jpg" id="h4" onclick="move(4)">
            <img src="images/5.jpg" id="h5" onclick="move(5)">
            <img src="images/4.jpg" id="h6" onclick="move(6)">
            <img src="images/3.jpg" id="h7" onclick="move(7)">
            <img src="images/2.jpg" id="h8" onclick="move(8)">
            <img src="images/blank.jpg" id="h9" onclick="move(9)">
            <img src="images/1.jpg" id="h">
        </div>

        <div class="button-container">
            <button onclick="Reset()" class="reset-btn">
                <img src="images/ball.ico" class="icon-img">
            </button>
        </div>
    </div>

    <!-- POKEMON WIN IMAGE -->
    <img src="images/pokemon.png" id="winOverlay" alt="You Win">
</div>

<script src="js/script.js"></script>
</body>
</html>
